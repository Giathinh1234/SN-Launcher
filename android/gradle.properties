# Project-wide Gradle settings for Nest Launcher.
#
# Tuned for low-RAM build machines: a parallel Gradle daemon plus Kotlin's own
# daemon can easily eat 2 GB on a machine already juggling a Pi's browser.
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512M -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# NOTE: configuration cache is deliberately OFF. The Android Gradle Plugin
# shells out to `sdkmanager` during configuration (to resolve NDK/build-tools
# versions), and Gradle refuses to serialise that process — enabling the cache
# turns every build into a 15-minute failure.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.incremental=true

# Hybrid CPU/GPU rendering. `true` = Impeller/Vulkan (GPU), `false` = the
# engine's Skia/OpenGL fallback, for GPU stacks with broken Vulkan drivers.
# Overridable per build with `-PenableImpeller=false`.
enableImpeller=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
